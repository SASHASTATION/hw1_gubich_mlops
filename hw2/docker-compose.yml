name: mlops-hw2
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "hw2_transactions", "--partitions", "3", "--replication-factor", "1"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    environment:
      CLICKHOUSE_USER: hw2
      CLICKHOUSE_PASSWORD: hw2_local_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"]
    volumes: ["clickhouse_data:/var/lib/clickhouse"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "hw2", "--password", "hw2_local_password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    image: clickhouse/clickhouse-server:25.3.6.56
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    volumes: ["./sql:/sql:ro"]
    entrypoint: ["/bin/sh", "-ec", "clickhouse-client --host clickhouse --user hw2 --password hw2_local_password --multiquery < /sql/01_schema.sql"]
  runner:
    build: .
    profiles: [tools]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: hw2
      CLICKHOUSE_PASSWORD: hw2_local_password
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ./results:/results
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  clickhouse_data:
